name: tab_overview
description: "Tab switcher with live thumbnails: show the tabs your app keeps open in a grid, zoom one into a full page, swipe between pages, drag to reorder and swipe to close."
version: 0.3.0
repository: https://github.com/igorkurilenko/tab_overview
topics:
  - tabs
  - transition
  - animation
  - drag-and-drop
  - reorderable

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  animated_reorderable: ^2.9.0
  hero_here: ">=1.5.4 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
